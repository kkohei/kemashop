<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KEMA 通知管理</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Hiragino Sans", sans-serif;
    background: linear-gradient(135deg, #6b4f14, #a9781a 40%, #d7a934);
    min-height: 100vh; padding: 24px 16px; color: #222;
  }
  .card {
    background: #fff; border-radius: 16px; padding: 22px;
    max-width: 560px; margin: 0 auto 16px;
    box-shadow: 0 6px 24px rgba(0,0,0,.18);
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #8a7325; font-size: 13px; margin-bottom: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; color: #555; }
  input, textarea {
    width: 100%; font-size: 16px; padding: 12px;
    border: 1px solid #ddd0a8; border-radius: 10px; background: #fffdf7;
  }
  textarea { min-height: 90px; resize: vertical; }
  button {
    width: 100%; margin-top: 16px; padding: 14px; font-size: 16px; font-weight: 700;
    color: #fff; background: linear-gradient(135deg, #b8860b, #8b6914);
    border: none; border-radius: 999px; cursor: pointer;
  }
  button:disabled { opacity: .5; }
  .stats { display: flex; gap: 12px; margin-bottom: 4px; }
  .stat { flex: 1; background: #faf6e8; border-radius: 12px; padding: 12px; text-align: center; }
  .stat .num { font-size: 26px; font-weight: 800; color: #8b6914; }
  .stat .lbl { font-size: 12px; color: #777; }
  .hist { font-size: 13px; }
  .hist-item { padding: 10px 0; border-bottom: 1px solid #eee; }
  .hist-item .t { font-weight: 700; }
  .hist-item .m { color: #555; white-space: pre-wrap; }
  .hist-item .d { color: #999; font-size: 11px; margin-top: 2px; }
  .msg { margin-top: 12px; font-size: 14px; text-align: center; }
  .msg.ok { color: #1a7a2e; } .msg.ng { color: #c0392b; }
  #main { display: none; }
</style>
</head>
<body>

<div class="card" id="login">
  <h1>KEMA 通知管理</h1>
  <p class="sub">管理パスワードを入力してください</p>
  <input type="password" id="pw" placeholder="管理パスワード" autocomplete="current-password">
  <button id="loginBtn">ログイン</button>
  <div class="msg" id="loginMsg"></div>
</div>

<div id="main">
  <div class="card">
    <div class="stats">
      <div class="stat"><div class="num" id="devCount">-</div><div class="lbl">登録端末</div></div>
      <div class="stat"><div class="num" id="delCount">-</div><div class="lbl">未対応の退会申請</div></div>
    </div>
  </div>

  <div class="card">
    <h1>一斉配信</h1>
    <p class="sub">登録されている全端末にプッシュ通知を送ります</p>
    <label>タイトル</label>
    <input id="title" placeholder="例: 夏季セールのお知らせ" maxlength="50">
    <label>本文</label>
    <textarea id="body" placeholder="例: 本日から全品10%OFF! アプリからぜひご注文ください。" maxlength="200"></textarea>
    <button id="sendBtn">全員に送信</button>
    <div class="msg" id="sendMsg"></div>
  </div>

  <div class="card">
    <h1>退会申請</h1>
    <p class="sub">未対応の申請は、Bカート管理画面で会員を削除してから「対応済みにする」を押してください</p>
    <div class="hist" id="deletions"><p class="sub">読み込み中...</p></div>
  </div>

  <div class="card">
    <h1>送信履歴</h1>
    <div class="hist" id="hist"><p class="sub">読み込み中...</p></div>
  </div>
</div>

<script>
var token = sessionStorage.getItem('kemaAdminToken') || '';

function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign(
    { 'Content-Type': 'application/json', 'X-Admin-Token': token },
    opts.headers || {}
  );
  return fetch(path, opts).then(function (r) {
    if (r.status === 401) throw new Error('unauthorized');
    return r.json();
  });
}

function fmtDate(iso) {
  try {
    var d = new Date(iso);
    return d.toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  } catch (e) { return iso; }
}

function refresh() {
  return api('/admin/stats').then(function (s) {
    document.getElementById('devCount').textContent = s.devices;
    document.getElementById('delCount').textContent = s.pendingDeletions;

    var h = document.getElementById('hist');
    if (!s.broadcasts.length) { h.innerHTML = '<p class="sub">まだ送信履歴はありません</p>'; }
    else {
      h.innerHTML = s.broadcasts.map(function (b) {
        return '<div class="hist-item"><div class="t">' + esc(b.title) + '</div>' +
               '<div class="m">' + esc(b.body) + '</div>' +
               '<div class="d">' + fmtDate(b.created_at) + ' / ' + b.sent_count + '台に送信</div></div>';
      }).join('');
    }

    var dl = document.getElementById('deletions');
    if (!s.deletionRequests || !s.deletionRequests.length) {
      dl.innerHTML = '<p class="sub">退会申請はありません</p>';
    } else {
      dl.innerHTML = s.deletionRequests.map(function (r) {
        var status = r.handled
          ? '<span style="color:#1a7a2e">対応済み</span>'
          : '<button style="margin:6px 0 0;padding:8px 14px;width:auto;font-size:13px" onclick="markHandled(' + r.id + ')">対応済みにする</button>';
        return '<div class="hist-item">' +
               '<div class="t">' + esc(r.member_id || '(会員不明)') + '</div>' +
               '<div class="d">申請日時: ' + fmtDate(r.created_at) + '</div>' +
               status + '</div>';
      }).join('');
    }
  });
}

function markHandled(id) {
  if (!confirm('この退会申請を「対応済み」にします。\nBカート管理画面での会員削除はお済みですか?')) return;
  api('/admin/deletion-handled', { method: 'POST', body: JSON.stringify({ id: id }) })
    .then(refresh)
    .catch(function () { alert('更新に失敗しました'); });
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function showMain() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('main').style.display = 'block';
  refresh();
}

document.getElementById('loginBtn').addEventListener('click', function () {
  token = document.getElementById('pw').value.trim();
  var msg = document.getElementById('loginMsg');
  msg.textContent = '確認中...'; msg.className = 'msg';
  api('/admin/stats').then(function () {
    sessionStorage.setItem('kemaAdminToken', token);
    showMain();
  }).catch(function () {
    msg.textContent = 'パスワードが違います'; msg.className = 'msg ng';
  });
});

document.getElementById('sendBtn').addEventListener('click', function () {
  var title = document.getElementById('title').value.trim();
  var body = document.getElementById('body').value.trim();
  var msg = document.getElementById('sendMsg');
  if (!title || !body) { msg.textContent = 'タイトルと本文を入力してください'; msg.className = 'msg ng'; return; }
  if (!confirm('全ユーザーに送信します。よろしいですか?\n\n【' + title + '】\n' + body)) return;

  var btn = document.getElementById('sendBtn');
  btn.disabled = true; msg.textContent = '送信中...'; msg.className = 'msg';
  api('/admin/broadcast', { method: 'POST', body: JSON.stringify({ title: title, body: body }) })
    .then(function (r) {
      msg.textContent = r.sent + '台に送信しました' + (r.failed ? '(失敗 ' + r.failed + ')' : '');
      msg.className = 'msg ok';
      document.getElementById('title').value = '';
      document.getElementById('body').value = '';
      refresh();
    })
    .catch(function () { msg.textContent = '送信に失敗しました'; msg.className = 'msg ng'; })
    .finally(function () { btn.disabled = false; });
});

// 保存済みトークンがあれば自動ログイン
if (token) {
  api('/admin/stats').then(showMain).catch(function () { token = ''; });
}
</script>
</body>
</html>
