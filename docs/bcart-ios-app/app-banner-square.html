<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>KEMA PRO SHOP 公式アプリ登場バナー</title>
<meta name="hz:slide-selector" content=".banner" />
<meta name="hz:canvas-width" content="1080" />
<meta name="hz:canvas-height" content="1080" />
<link rel="stylesheet" href="https://use.typekit.net/eym8xzs.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f0f0f0; }

  .banner {
    position: relative;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: linear-gradient(135deg, #6b4f14 0%, #a9781a 35%, #d7a934 72%, #f7e9b6 100%);
  }
  .glow {
    position: absolute; left: -180px; top: -180px; width: 760px; height: 760px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.32), rgba(255,255,255,0) 65%);
  }

  /* ブランド(左上) — 正規ロゴマーク */
  .marklogo {
    position: absolute; left: 64px; top: 56px; width: 78px; height: 78px;
  }
  .brandname {
    position: absolute; left: 158px; top: 64px;
    font-family: "kinuta-mincho-stdn", "Noto Serif JP", serif;
    font-weight: 400; font-size: 40px; letter-spacing: 10px; color: #ffffff;
  }
  .brandsub {
    position: absolute; left: 161px; top: 112px;
    font-family: "sawarabi-gothic", "Noto Sans JP", sans-serif;
    font-weight: 400; font-size: 15px; letter-spacing: 7px; color: #ffffff; opacity: 0.95;
  }

  /* ラベル */
  .label {
    position: absolute; left: 64px; top: 208px;
    display: inline-block; padding: 10px 26px;
    border: 2px solid rgba(255,255,255,0.9); border-radius: 999px;
    font-family: "sawarabi-gothic", "Noto Sans JP", sans-serif;
    font-weight: 400; font-size: 24px; letter-spacing: 4px; color: #ffffff;
  }

  /* 見出し */
  .headline {
    position: absolute; left: 60px; top: 292px; width: 620px;
    font-family: "kinuta-mincho-stdn", "Noto Serif JP", serif;
    font-weight: 400; font-size: 104px; line-height: 1.28;
    color: #ffffff; letter-spacing: 6px;
    text-shadow: 0 2px 14px rgba(80, 55, 10, 0.35);
  }
  .sub {
    position: absolute; left: 66px; top: 596px; width: 560px;
    font-family: "sawarabi-gothic", "Noto Sans JP", sans-serif;
    font-weight: 400; font-size: 27px; line-height: 1.7; letter-spacing: 2px;
    color: #ffffff;
  }

  /* 機能タグ */
  .tags { position: absolute; left: 64px; top: 692px; width: 560px; }
  .tag {
    display: inline-block; margin: 0 10px 12px 0; padding: 9px 20px;
    background: rgba(255,255,255,0.16);
    border: 1px solid rgba(255,255,255,0.75); border-radius: 999px;
    font-family: "sawarabi-gothic", "Noto Sans JP", sans-serif;
    font-weight: 400; font-size: 21px; letter-spacing: 2px; color: #ffffff;
  }

  /* QR + CTA */
  .qrcard {
    position: absolute; left: 64px; top: 836px; width: 180px; height: 180px;
    background: #ffffff; border-radius: 18px;
    box-shadow: 0 10px 30px rgba(60, 40, 0, 0.30);
  }
  .qrimg { position: absolute; left: 74px; top: 846px; width: 160px; height: 160px; }
  .cta {
    position: absolute; left: 272px; top: 872px;
    display: inline-block; background: #131313; color: #ffffff;
    padding: 20px 40px; border-radius: 999px;
    font-family: "m-plus-1p", "Noto Sans JP", sans-serif;
    font-weight: 700; font-size: 29px; letter-spacing: 1px;
    box-shadow: 0 8px 24px rgba(40, 25, 0, 0.35);
  }
  .ctanote {
    position: absolute; left: 276px; top: 954px;
    font-family: "sawarabi-gothic", "Noto Sans JP", sans-serif;
    font-weight: 400; font-size: 20px; line-height: 1.7; letter-spacing: 1px;
    color: #ffffff;
  }

  /* スマホモック(右) — CSSで直接描画・バナー座標に直接配置 */
  .phonebody {
    position: absolute; left: 664px; top: 316px; width: 395px; height: 820px;
    border-radius: 56px; background: #111111;
    box-shadow: 0 30px 60px rgba(60, 40, 0, 0.35);
  }
  .phonescreen {
    position: absolute; left: 676px; top: 328px; width: 371px; height: 796px;
    border-radius: 44px; overflow: hidden;
    background:
      radial-gradient(circle at 30% 24%, rgba(255,255,255,0.4), rgba(255,255,255,0) 52%),
      linear-gradient(135deg, #6b4f14 0%, #a9781a 30%, #d7a934 62%, #efd47e 88%, #f7e9b6 100%);
  }
  .phoneisland {
    position: absolute; top: 14px; left: 140px; width: 91px; height: 26px;
    border-radius: 14px; background: #000000;
  }
  .phonemarklogo {
    position: absolute; top: 226px; left: 138px; width: 95px; height: 95px;
  }
  .phonename {
    position: absolute; top: 340px; left: 0; width: 371px; text-align: center;
    font-family: "kinuta-mincho-stdn", "Noto Serif JP", serif;
    font-weight: 400; font-size: 40px; letter-spacing: 11px; text-indent: 11px;
    color: #ffffff;
  }
  .phonesub {
    position: absolute; top: 395px; left: 0; width: 371px; text-align: center;
    font-family: "sawarabi-gothic", "Noto Sans JP", sans-serif;
    font-weight: 400; font-size: 15px; letter-spacing: 9px; text-indent: 9px;
    color: #ffffff;
  }
  .phonebtn1 {
    position: absolute; left: 41px; top: 625px; width: 289px;
    padding: 15px 0; border-radius: 999px; background: #ffffff;
    text-align: center; color: #1a1a1a;
    font-family: "m-plus-1p", "Noto Sans JP", sans-serif;
    font-weight: 700; font-size: 17px;
  }
  .phonebtn2 {
    position: absolute; left: 41px; top: 690px; width: 289px;
    padding: 14px 0; border-radius: 999px;
    border: 2px solid rgba(255,255,255,0.95); background: rgba(255,255,255,0.12);
    text-align: center; color: #ffffff;
    font-family: "m-plus-1p", "Noto Sans JP", sans-serif;
    font-weight: 700; font-size: 17px;
  }
</style>
</head>
