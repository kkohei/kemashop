<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>KEMA PRO SHOP 公式アプリ ボタンバナー</title>
<meta name="hz:slide-selector" content=".banner" />
<meta name="hz:canvas-width" content="1080" />

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f0f0f0; }

  .banner {
    position: relative;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: linear-gradient(135deg, #6b4f14 0%, #a9781a 35%, #d7a934 72%, #f7e9b6 100%);
  }
  .glow {
    position: absolute; left: 160px; top: -220px; width: 760px; height: 760px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.30), rgba(255,255,255,0) 65%);
  }

  /* ブランド(中央上) — 正規ロゴマーク */
  .marklogo {
    position: absolute; left: 487px; top: 152px; width: 106px; height: 106px;
  }
  .brandname {
    position: absolute; left: 0; top: 282px; width: 1080px; text-align: center;
    font-family: "kinuta-mincho-stdn", "Noto Serif JP", serif;
    font-weight: 400; font-size: 56px; letter-spacing: 16px; text-indent: 16px;
    color: #ffffff;
  }
  .brandsub {
    position: absolute; left: 0; top: 360px; width: 1080px; text-align: center;
    font-family: "sawarabi-gothic", "Noto Sans JP", sans-serif;
    font-weight: 400; font-size: 19px; letter-spacing: 11px; text-indent: 11px;
    color: #ffffff; opacity: 0.95;
  }

  /* ラベル */
  .label {
    position: absolute; left: 330px; top: 462px; width: 420px;
    padding: 11px 0; text-align: center;
    border: 2px solid rgba(255,255,255,0.9); border-radius: 999px;
    font-family: "sawarabi-gothic", "Noto Sans JP", sans-serif;
    font-weight: 400; font-size: 24px; letter-spacing: 4px; color: #ffffff;
  }

  /* 見出し */
  .headline-en {
    position: absolute; left: 0; top: 574px; width: 1080px; text-align: center;
    font-family: "kinuta-mincho-stdn", "Noto Serif JP", serif;
    font-weight: 400; font-size: 22px; letter-spacing: 12px; text-indent: 12px;
    color: #ffffff; opacity: 0.9;
  }
  .headline {
    position: absolute; left: 0; top: 616px; width: 1080px; text-align: center;
    font-family: "kinuta-mincho-stdn", "Noto Serif JP", serif;
    font-weight: 400; font-size: 80px; line-height: 1.2;
    color: #ffffff; letter-spacing: 30px; text-indent: 30px;
    text-shadow: 0 2px 12px rgba(80, 55, 10, 0.30);
  }
  .hairline {
    position: absolute; top: 587px; width: 90px; height: 1px;
    background: rgba(255,255,255,0.65);
  }
  .hairline.l { left: 300px; }
  .hairline.r { left: 690px; }

  /* CTAピル */
  .cta {
    position: absolute; left: 270px; top: 794px; width: 540px;
    padding: 24px 0; text-align: center;
    background: #131313; color: #ffffff; border-radius: 999px;
    font-family: "m-plus-1p", "Noto Sans JP", sans-serif;
    font-weight: 700; font-size: 31px; letter-spacing: 1px;
    box-shadow: 0 8px 24px rgba(40, 25, 0, 0.35);
  }
  .ctanote {
    position: absolute; left: 0; top: 908px; width: 1080px; text-align: center;
    font-family: "sawarabi-gothic", "Noto Sans JP", sans-serif;
    font-weight: 400; font-size: 21px; letter-spacing: 2px;
    color: #ffffff;
  }
</style>
